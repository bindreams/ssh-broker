[package]
name = "ssh-broker"
version = "0.1.0"
edition = "2024"

# Cross-platform dependencies (compile + unit-test on the macOS host).
# Versions are pinned and cited per project rule; exact resolved versions live in
# Cargo.lock. Citations gathered by the verify-foundation-crates workflow.
[dependencies]
anyhow = "1.0"               # error context: Result, anyhow!, ensure!, bail!
thiserror = "2.0"            # derive(Error) for typed protocol errors
serde = { version = "1.0", features = ["derive"] }     # Handshake (de)serialize (1.0.228)
postcard = { version = "1.1", features = ["use-std"] } # compact serde wire format; `use-std` gates to_stdvec (1.1.3)
socket2 = "0.6"                                         # AF_UNIX on Windows (Domain::UNIX, SockAddr::unix, shutdown) — no extra feature needed (0.6.4)
tracing = "0.1"              # structured logging
tracing-subscriber = "0.3"  # file/stderr log sink (Phase 6 routes off the PTY)
zeroize = "1"                # volatile wipe of password buffers (secret.rs)

[dev-dependencies]
pipe = "0.4"                 # two unidirectional pipes compose the splittable relay test transport, EOF-on-writer-drop (Phase 2; 0.4.0)

# Windows-only dependencies. Not compiled on the macOS host, so the pure-logic
# protocol/relay phases unit-test natively here.
[target.'cfg(windows)'.dependencies]
# cosca: kernel-enforced process-tree containment (Windows Job Objects) for the agent and for
# the shim's fail-open passthrough. Windows-gated again now that transfer detection is gone —
# its `CommandLineToArgvW` splitter was the only cross-platform user.
cosca = "0.5"

windows = { version = "0.62.2", features = [
    "Win32_System_Console",
    "Win32_System_Environment",    # GetCommandLineW: the shim recovers sshd's exact `-c` text
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",       # DefaultShell registry pair (Reg* APIs)
    "Win32_Networking_WinSock",    # WSAPoll for the hangup watcher
    "Win32_Security_Cryptography", # DPAPI parity probe (CryptProtectData/CryptUnprotectData)
    "Win32_UI_Shell",              # GetUserProfileDirectoryW: the profile of a token
    "Win32_System_TaskScheduler",  # stop/start the agent task per session (COM)
    "Win32_System_Com",            # CoInitializeEx / CoCreateInstance for the Task Scheduler
    "Win32_System_Ole",            # ITaskService::Connect takes VARIANTs
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming", # GetComputerNameW: is an account local to this PC
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",       # NtOpenFile: open a directory for ACL inspection without SYNCHRONIZE
] }

# tracing-appender: rolling file sink for the shim's logs under ProgramData (the shim must
# never log to the PTY stdout/stderr in interactive mode). Only the Windows shim uses it.
tracing-appender = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
    "Win32_UI_Shell", # CommandLineToArgvW: tests/conhost_windows.rs checks the test encoder's tokenizer against it
    "Win32_NetworkManagement_NetManagement", # NetUserAdd/NetUserDel: tests/user_isolation_windows.rs makes throwaway accounts
    "Wdk_System_Threading",                  # ProcessDefaultHardErrorMode: tests/common/hard_errors.rs makes a child's loader failure exit instead of raise a message box
    "Win32_System_LibraryLoader",            # LoadLibraryW/GetProcAddress: tests/common/desktop.rs binds user32 at run time
    "Win32_System_Kernel",                   # PROCESS_BASIC_INFORMATION: tests/common/process_list.rs reads a process's own recorded parent
    "Win32_System_StationsAndDesktops",     # HWINSTA/HDESK: tests/common/desktop.rs gives each child its own window station and desktop
    "Win32_System_Diagnostics_ToolHelp",     # CreateToolhelp32Snapshot: tests/common/process_list.rs finds a process's descendants
] }
