[package]
name = "ssh-broker"
version = "0.1.0"
edition = "2024"

# Cross-platform dependencies (compile + unit-test on the macOS host).
# Versions are pinned and cited per project rule; exact resolved versions live in
# Cargo.lock. Citations gathered by the verify-foundation-crates workflow.
[dependencies]
anyhow = "1.0"               # error context: Result, anyhow!, ensure!, bail!
thiserror = "2.0"            # derive(Error) for typed protocol errors
serde = { version = "1.0", features = ["derive"] }     # Handshake (de)serialize (1.0.228)
postcard = { version = "1.1", features = ["use-std"] } # compact serde wire format; `use-std` gates to_stdvec (1.1.3)
socket2 = "0.6"                                         # AF_UNIX on Windows (Domain::UNIX, SockAddr::unix, shutdown) — no extra feature needed (0.6.4)
tracing = "0.1"              # structured logging
tracing-subscriber = "0.3"  # file/stderr log sink (Phase 6 routes off the PTY)
toml = "0.8"                 # provision config.toml (de)serialize — pure, host-buildable (0.8.x)

# cosca: `CommandLineToArgvW`-compatible argv splitting for the shim's transfer detection.
# Pure UTF-16 logic, so it is not Windows-gated and the host tests exercise it.
cosca = "0.4"

[dev-dependencies]
pipe = "0.4"                 # two unidirectional pipes compose the splittable relay test transport, EOF-on-writer-drop (Phase 2; 0.4.0)

# Windows-only dependencies. Not compiled on the macOS host, so the pure-logic
# protocol/relay phases unit-test natively here.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",       # DefaultShell registry pair (Reg* APIs)
    "Win32_Security_Cryptography", # DPAPI parity probe (CryptProtectData/CryptUnprotectData)
] }

# tracing-appender: rolling file sink for the shim's logs under ProgramData (the shim must
# never log to the PTY stdout/stderr in interactive mode). Only the Windows shim uses it.
tracing-appender = "0.2"
