# The Elevated Windows tests (`tests/*_windows.rs`) log accounts on, start agents and wait for them.
# A wait that never ends must end the one test and name it, so the run prints every failure and
# every hang. `cargo test` prints a failure only when the whole binary has finished, which a
# single hang prevents.

# The tests that take the machine alone (`machine::exclusive()`): they stop `seclogon` or
# replace the machine install, so no other test may run beside them. What excludes them is the
# cross-process lock in `tests/common/machine.rs`, which holds for any test that calls `exclusive()`.
# This split only keeps them from waiting out the whole parallel run (the lock is not fair to a
# writer): `ci` leaves them out and `ci-exclusive` runs them alone. Keep the two filters
# complementary; a test missing from them is still correct, only slow.
#
# `shell_sshd_windows` takes the machine alone too, but runs in `ci`: its logons start the agent from the
# installed exe (`provision::canonical_exe()`), which the workflow puts in place for `ci` and takes away
# before `ci-exclusive` (`upgrade_windows` asserts the directory is absent).
# `sshd_config_windows` takes the machine alone and runs `apply`, which refuses an install directory it cannot
# trust, so the whole binary runs in `ci-exclusive`, where the directory is absent. Each of its tests that runs
# `apply` puts the machine back through `install::Install`, as the `apply_` tests of `upgrade_windows` do, so
# that the directory is absent for whichever of the two binaries runs next.

# The `m3_` tests of `session_on_demand_windows` measure what a caller's jobs do to the logon child, so
# the test process must be in no job. nextest puts every test in one, so `ci` leaves them out and the
# workflow runs them from the test binary itself ("M3 tests outside any job" in ci.yaml).
[profile.ci]
fail-fast = false
default-filter = 'not (binary(session_on_demand_windows) & test(/^logon_with_seclogon_(stopped|disabled)_returns_windows_reason$/)) & not (binary(upgrade_windows) & test(/^apply_/)) & not binary(sshd_config_windows) & not (binary(session_on_demand_windows) & test(/^m3_/))'
# A failure bound on our own run, never a pass: the longest test (an account that needs a profile,
# a logon, a session) takes a few minutes, and the waits inside a test have bounds of their own
# that fail first with a message. A test still running at this bound is ended and reported as
# timed out.
slow-timeout = { period = "120s", terminate-after = 5, grace-period = "1s" }

# `logon_sessions_with_no_process_do_not_pile_up` starts and ends three sessions in its body, so its own bounds
# add up to more than the 10 x 120 s of the binaries below. Its bounds: 3 x `SESSION_END_BOUND` (3 x 360 s),
# the task starts (`TASK_START_BOUND`, 180 s: one wait in cycle 1, two in each of cycles 2 and 3, 900 s) and the
# teardown (`UNLOAD_BOUND`, 120 s), 2100 s together. 10 x 300 s leaves 900 s for the waits for the processes'
# exit and for the `logout` of a `LogOutOnDrop` after a failed cycle. The first override that matches a test
# sets its timeout, so this one comes before the one for the binary.
[[profile.ci.overrides]]
filter = 'binary(auto_login_windows) & test(=logon_sessions_with_no_process_do_not_pile_up)'
slow-timeout = { period = "300s", terminate-after = 10, grace-period = "1s" }

# A test that makes an account ends it in its teardown, which for a secondary-logon account whose hive
# stays loaded waits `UNLOAD_BOUND` (120 s) in `profile::remove`, and each `logout` waits up to
# `SESSION_END_BOUND` (360 s) for the ended logon sessions to leave the system's list. The default 600 s could
# end such a test in the middle of its teardown, lose the message and leave the account and its profile. These
# binaries get 10 x 120 s, which is every binary that ends a session (`request_socket_windows` does so through
# `LogOutOnDrop`).
[[profile.ci.overrides]]
filter = 'binary(agent_window_windows) | binary(auto_login_windows) | binary(private_dir_elevated_windows) | binary(prompt_path_windows) | binary(real_sshd_windows) | binary(request_socket_windows) | binary(shell_sshd_windows) | binary(session_on_demand_windows) | binary(sshd_config_windows) | binary(upgrade_windows) | binary(user_isolation_windows)'
slow-timeout = { period = "120s", terminate-after = 10, grace-period = "1s" }

# The real-sshd test measures things the plan has never seen (the shim's session, logon type and job under
# sshd): its output is the result, so a passing run prints it too.
[[profile.ci.overrides]]
filter = 'binary(real_sshd_windows)'
success-output = "immediate"

# `a_command_with_a_terminal_has_a_terminal` prints the exit code stock sshd gives `ssh -tt host "exit 7"`, which the
# broker's is held to: a passing run prints it too.
[[profile.ci.overrides]]
filter = 'binary(shell_sshd_windows) & test(=a_command_with_a_terminal_has_a_terminal)'
success-output = "immediate"

[profile.ci-exclusive]
inherits = "ci"
default-filter = '(binary(session_on_demand_windows) & test(/^logon_with_seclogon_(stopped|disabled)_returns_windows_reason$/)) | (binary(upgrade_windows) & test(/^apply_/)) | binary(sshd_config_windows)'
