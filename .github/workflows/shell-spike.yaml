# Throwaway measurement run for ssh-broker U1-C, Task 0. Lives on the branch U1-C-spike only and is
# never merged. Every test prints `SPIKE <key>=<value>` lines to the log and appends them to
# $SPIKE_FACTS_FILE, which the last step uploads (GitHub keeps no log for a job cancelled at its timeout).
# The sshd tests change the machine's DefaultShell, so each runs on a runner of its own.
name: Shell spike

on:
  workflow_dispatch:

jobs:
  sshd:
    name: ${{ matrix.test }}
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        test: [m1_binary_safety, m3_generic, m3_pwsh, m3_bash, m3_cmd, m3_spaced]
    steps:
      - uses: actions/checkout@v7
      - name: Choose the facts file
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "SPIKE_FACTS_FILE=$env:RUNNER_TEMP\spike-facts.txt"
      - name: Install pinned toolchain
        timeout-minutes: 10
        run: rustup toolchain install
      - name: The image
        shell: pwsh
        run: |
          "ImageVersion=$env:ImageVersion"
          [System.Environment]::OSVersion.VersionString
          ssh -V
          & 'C:\Program Files\PowerShell\7\pwsh.exe' --version
          & 'C:\Program Files\Git\bin\bash.exe' --version
          Get-Service sshd | Format-List Name, Status, StartType
          Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String -Pattern '^\s*[^#\s]'
          reg query HKLM\SOFTWARE\OpenSSH
      - name: Build
        timeout-minutes: 30
        run: |
          cargo build --locked --examples
          cargo test --locked --test shell_measure_windows --no-run
      - name: Measure
        timeout-minutes: 200
        run: cargo test --locked --test shell_measure_windows ${{ matrix.test }} -- --exact --nocapture
      - name: Upload the facts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        timeout-minutes: 5
        with:
          name: facts-${{ matrix.test }}
          path: ${{ env.SPIKE_FACTS_FILE }}
          if-no-files-found: warn

  local:
    name: local measurements
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Choose the facts file
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "SPIKE_FACTS_FILE=$env:RUNNER_TEMP\spike-facts.txt"
      - name: Install pinned toolchain
        timeout-minutes: 10
        run: rustup toolchain install
      - name: Build
        timeout-minutes: 30
        run: |
          cargo build --locked --examples
          cargo test --locked --test shell_measure_windows --no-run
      - name: M2
        if: always()
        timeout-minutes: 15
        run: cargo test --locked --test shell_measure_windows m2_msys2 -- --exact --nocapture
      - name: M4
        if: always()
        timeout-minutes: 5
        run: cargo test --locked --test shell_measure_windows m4_cmd_identity -- --exact --nocapture
      - name: M5
        if: always()
        timeout-minutes: 5
        run: cargo test --locked --test shell_measure_windows m5_search_path -- --exact --nocapture
      - name: M6 stdin
        if: always()
        timeout-minutes: 10
        run: cargo test --locked --test shell_measure_windows m6_stdin -- --exact --nocapture
      - name: M6 stdout
        if: always()
        timeout-minutes: 10
        run: cargo test --locked --test shell_measure_windows m6_stdout -- --exact --nocapture
      - name: Upload the facts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        timeout-minutes: 5
        with:
          name: facts-local
          path: ${{ env.SPIKE_FACTS_FILE }}
          if-no-files-found: warn
