name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by draft-release.yaml, so the release commit is tested before a draft exists.
  workflow_call:

# Only PR runs are superseded. Everything else gets a group of its own, keyed on the run
# id, so it can never be cancelled by a later run: `cancel-in-progress: false` still
# cancels a *pending* run when a newer one joins the group, which for a shared group
# would leave a commit on main with no completed CI after two quick merges.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The nextest version the test job installs.
  NEXTEST_VERSION: "0.9.148"

# No toolchain action: `rust-toolchain.toml` is a rustup directory override, so the
# first `cargo`/`rustup` call in the workspace installs the pinned channel along with
# its `components` and `targets`. The install step below exists to make that explicit
# and to keep the download out of the middle of a check's log — it is NOT a gate:
# `rustup toolchain install` exits 0 even when a declared target is unavailable (it
# only warns). What does gate is the cargo steps that follow: they cannot run at all on
# a toolchain that failed to install, and fail loudly on a missing component. A missing
# *target* stays invisible here, and that is accepted — CI builds natively and never
# cross-compiles; `targets` exists in the toolchain file for local `cargo xwin` use.
#
# Job names are load-bearing — they are the required status-check contexts on the
# default branch. Renaming one silently blocks every PR, because a required context
# that never reports is indistinguishable from one that has not finished.

jobs:
  # One source of truth for the platform set. Two jobs need the identical matrix, and a
  # workflow cannot share a `strategy.matrix` between them any other way; duplicating the
  # list is how a platform silently ends up linted but not tested, or the reverse.
  platforms:
    name: Platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          echo 'matrix={"include":[{"os":"windows-latest","label":"windows/amd64"},{"os":"macos-latest","label":"macos/arm64"}]}' >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (${{ matrix.label }})
    needs: platforms
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        run: rustup toolchain install

      # Formatting is platform-independent, but clippy is not: it only sees one `cfg`
      # per invocation, so a single-platform lint job would never lint the other half
      # of the codebase. Most of this crate is `cfg(windows)`.
      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # The hooks are only a gate for people who have them installed and do not pass
      # `--no-verify`. Running them here makes them a gate for everyone — without this,
      # a commit that fails a hook still reaches main with CI green.
      #
      # Both steps are macOS-only: they are platform-independent, and `python3` is not on
      # PATH under that name on the Windows runners. They sit inside an already-required
      # job rather than in a job of their own, because a check nobody requires cannot
      # block the merge it exists to block.
      # renovate: datasource=github-releases depName=astral-sh/setup-uv
      - uses: astral-sh/setup-uv@v10.3.0
        if: runner.os == 'macOS'
      - name: prek hooks
        if: runner.os == 'macOS'
        run: |
          uv tool install prek
          prek run --all-files

      # The hooks' own patterns need a gate too — two successive versions shipped regexes
      # that silently could not fire.
      - name: prek pattern regression test
        if: runner.os == 'macOS'
        run: python3 scripts/prek_patterns_test.py

  test:
    name: Test (${{ matrix.label }})
    needs: platforms
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        run: rustup toolchain install

      # Tests wait for a Security event, which the system writes only with the auditing on: the end of a
      # logon session (4634: `logon_session_is_logged_off_after_logout` and every test that ends a background
      # session with `logout`, see `tests/common/session_end.rs`) and a refused logon
      # (`a_stale_password_is_not_visible_in_the_last_result`, 4625).
      - name: Audit logons and logoffs
        if: runner.os == 'Windows'
        run: |
          auditpol /set /subcategory:"Logoff" /success:enable
          auditpol /set /subcategory:"Logon" /failure:enable
          wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true

      # nextest, one process per test: each failure prints when it happens, and a test that hangs is
      # ended at the bound in `.config/nextest.toml` and named. `cargo test` prints failures only when
      # a binary has finished, so one hang hid every failure after it.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      # The prompt path starts the background agent from the installed exe (`provision::canonical_exe()`),
      # and no test installs it, so a logon in a prompt test has no file to start the agent from.
      # It is taken away again below, because `upgrade_windows` asserts the directory is absent.
      - name: Put the exe where the prompt path starts agents from
        if: runner.os == 'Windows'
        run: |
          cargo build --locked
          New-Item -ItemType Directory -Force C:\ProgramData\ssh-broker | Out-Null
          Copy-Item target\debug\ssh-broker.exe C:\ProgramData\ssh-broker\ssh-broker.exe

      - name: Disk report (before the tests)
        if: (success() || failure()) && runner.os == 'Windows'
        run: .github/scripts/disk-report.ps1 'before the tests'

      - name: cargo nextest
        run: cargo nextest run --locked --profile ci

      - name: Disk report (after nextest)
        if: (success() || failure()) && runner.os == 'Windows'
        run: .github/scripts/disk-report.ps1 'after nextest'

      # The `m3_` tests measure what a caller's jobs do to the logon child (`logon::probe`), so the test
      # process must be in no job. nextest and cargo each put what they run in one, and so does the runner
      # for a step (a job with no limits). Task Scheduler starts a task outside all of them, so
      # the test binary runs as a one-shot task of SYSTEM with its output in a file that this step prints.
      # Each case asserts at its start that it is in no job. The filter `m3_` is a substring match and the one
      # in `.config/nextest.toml` that leaves them out of the step above (`/^m3_/`) is anchored, so the step
      # lists what `m3_` selects first and fails if that is nothing or includes a test that does not start with
      # `m3_` (which both would run). libtest exits 0 when a filter selects nothing, so after the run the step
      # also compares the number of tests that passed with the number listed. The wait re-checks the task's own
      # state: it is over when the task is ready again and its last result has moved off "never run" (267011);
      # the task's last result is the exit code of the test binary, which fails this step when it is not 0.
      - name: M3 tests outside any job
        if: (success() || failure()) && runner.os == 'Windows'
        run: |
          $built = cargo test --locked --test session_on_demand_windows --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = $built | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.executable -and $_.target.name -eq 'session_on_demand_windows' } |
            ForEach-Object { $_.executable }
          if (-not $exe) { throw "cargo did not name the session_on_demand_windows test binary" }
          $listed = @(& $exe m3_ --list | ForEach-Object { if ($_ -match '^(.*): test$') { $Matches[1] } })
          if ($LASTEXITCODE -ne 0) { throw "listing the m3_ tests failed with exit code $LASTEXITCODE" }
          if ($listed.Count -eq 0) { throw "no test of session_on_demand_windows matches m3_: this step would run nothing" }
          $stray = @($listed | Where-Object { $_ -notmatch '^m3_' })
          if ($stray.Count -gt 0) { throw "matched by m3_ but not starting with it, so nextest runs them too: $($stray -join ', ')" }
          $out = Join-Path $env:RUNNER_TEMP 'm3-outside-any-job.txt'
          Remove-Item -Force -ErrorAction SilentlyContinue $out
          $task = "sb-m3-$PID"
          $action = New-ScheduledTaskAction -Execute 'cmd.exe' -WorkingDirectory (Get-Location).Path `
            -Argument ('/s /c ""{0}" m3_ > "{1}" 2>&1"' -f $exe, $out)
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -RunLevel Highest
          Register-ScheduledTask -TaskName $task -Action $action -Principal $principal | Out-Null
          try {
            Start-ScheduledTask -TaskName $task
            # The state is read first: a task seen Ready has finished, so the result read after it is this run's
            # and not the result of a run that was still going when the state was read.
            do {
              $state = (Get-ScheduledTask -TaskName $task).State
              $info = Get-ScheduledTaskInfo -TaskName $task
            } while ($state -ne 'Ready' -or $info.LastTaskResult -eq 267011)
            $code = $info.LastTaskResult
          } finally {
            Stop-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName $task -Confirm:$false
          }
          $text = if (Test-Path $out) { Get-Content -Raw $out } else { '' }
          if ($text) { Write-Output $text } else { Write-Output "the task wrote no output to $out" }
          Write-Output "m3 test binary exit code: $code"
          if ($code -ne 0) { exit 1 }
          $passed = 0
          foreach ($m in [regex]::Matches($text, 'test result: ok\. (\d+) passed')) { $passed += [int]$m.Groups[1].Value }
          if ($passed -ne $listed.Count) { throw "m3 tests passed: $passed, listed: $($listed.Count)" }

      - name: Disk report (after the M3 tests)
        if: (success() || failure()) && runner.os == 'Windows'
        run: .github/scripts/disk-report.ps1 'after the M3 tests'

      - name: Take that exe away again
        if: (success() || failure()) && runner.os == 'Windows'
        run: Remove-Item -Recurse -Force C:\ProgramData\ssh-broker

      # The tests that take the machine alone (`machine::exclusive()`) run after the rest, one at a time.
      - name: cargo nextest (machine-exclusive tests)
        if: success() || failure()
        run: cargo nextest run --locked --profile ci-exclusive --test-threads 1 --no-tests pass

      - name: Doctests
        if: success() || failure()
        run: cargo test --locked --doc

      - name: Disk report (end)
        if: (success() || failure()) && runner.os == 'Windows'
        run: .github/scripts/disk-report.ps1 'end'

      # What the tests recorded about the end of sessions and the state of hives and profiles afterwards
      # (tests/common/hive.rs); nextest hides the output of a test that passes.
      - name: Profile unload measurements
        if: (success() || failure()) && runner.os == 'Windows'
        run: |
          $file = 'C:\ProgramData\sb-profile-measure.log'
          if (Test-Path -LiteralPath $file) { Get-Content -LiteralPath $file } else { 'no measurement was recorded' }

      # What the system recorded about logons, scheduled tasks and sshd, for a failed run to be read from the log.
      - name: Logon and task events
        if: failure() && runner.os == 'Windows'
        run: |
          wevtutil qe Security /q:"*[System[(EventID=4625)]]" /c:20 /rd:true /f:text
          wevtutil qe Microsoft-Windows-TaskScheduler/Operational /c:80 /rd:true /f:text
          wevtutil qe OpenSSH/Operational /c:80 /rd:true /f:text
