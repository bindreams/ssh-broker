# Throwaway measurement run for ssh-broker U1-C spike 2 (M7). Lives on the branch U1-C-spike only and is
# never merged. Each test makes accounts and (m7_sshd) changes sshd's DefaultShell, so each runs on a runner
# of its own. Facts are printed as `SPIKE <key>=<value>` and uploaded.
name: M7 spike

on:
  push:
    branches: [U1-C-spike]
  workflow_dispatch:

jobs:
  m7:
    name: ${{ matrix.test }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test: [m7_sshd, m7_logon, m7_task]
    steps:
      - uses: actions/checkout@v7
      - name: Choose the facts file
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "SPIKE_FACTS_FILE=$env:RUNNER_TEMP\spike-facts.txt"
      - name: Install pinned toolchain
        timeout-minutes: 10
        run: rustup toolchain install
      - name: The image
        shell: pwsh
        run: |
          "ImageVersion=$env:ImageVersion"
          [System.Environment]::OSVersion.VersionString
          ssh -V
          Get-Service sshd | Format-List Name, Status, StartType
          reg query HKLM\SOFTWARE\OpenSSH
      - name: Build
        timeout-minutes: 30
        run: |
          cargo build --locked --examples
          cargo test --locked --test shell_measure_windows --no-run
      - name: Measure
        timeout-minutes: 30
        run: cargo test --locked --test shell_measure_windows ${{ matrix.test }} -- --exact --nocapture
      - name: Upload the facts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        timeout-minutes: 5
        with:
          name: facts-${{ matrix.test }}
          path: ${{ env.SPIKE_FACTS_FILE }}
          if-no-files-found: warn
